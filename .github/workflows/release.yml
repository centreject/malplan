name: Release

# Push a tag like v0.2.0: builds the signed NSIS installer and publishes a GitHub Release with
# latest.json, which installed apps read to update themselves.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run check
      - run: npm run fetch:llama
      # Built here, without the signing key in the environment: no npm script or build dependency sees it.
      - run: npm run build && npm run build:mcp
      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The updater key: repository secret, never committed. The key has no password (a new key would cut
          # off every installed app's updates), so it is only given to this step.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "malplan ${{ github.ref_name }}"
          releaseBody: "변경 내역: [CHANGELOG.md](https://github.com/centreject/malplan/blob/${{ github.ref_name }}/CHANGELOG.md)"
          releaseDraft: true
          includeUpdaterJson: true
          # The frontend and MCP server are built above; skip beforeBuildCommand here.
          args: --config src-tauri/tauri.release.conf.json
