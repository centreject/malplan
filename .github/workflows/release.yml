name: Release

# Push a tag like v0.2.0: builds the signed NSIS installer and publishes a GitHub Release with
# latest.json, which installed apps read to update themselves.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run check
      - run: npm run fetch:llama
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The updater key: repository secret, never committed. The key has no password.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "malplan ${{ github.ref_name }}"
          releaseBody: "변경 내역: [CHANGELOG.md](https://github.com/centreject/malplan/blob/${{ github.ref_name }}/CHANGELOG.md)"
          releaseDraft: true
          includeUpdaterJson: true
